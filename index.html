<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkShort - Encurtador do Manuel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 to-slate-900 h-screen flex items-center justify-center p-4">

    <div class="bg-white/10 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-md border border-white/20">
        <h1 class="text-white text-3xl font-bold mb-2 text-center">LinkShort 🔗</h1>
        <p class="text-indigo-200 text-sm text-center mb-8">Encurte seus links de forma rápida</p>

        <div class="space-y-4">
            <input type="url" id="inputUrl" placeholder="Cole seu link longo aqui..." 
                class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            
            <button onclick="encurtar()" id="btnEncurtar"
                class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-95">
                Encurtar Link
            </button>
        </div>

        <div id="resultado" class="hidden mt-8 p-4 bg-white/5 rounded-xl border border-dashed border-white/30 text-center">
            <p class="text-indigo-300 text-xs uppercase font-bold mb-2">Seu link curto:</p>
            <a href="#" id="shortUrl" target="_blank" class="text-white font-mono text-lg break-all hover:underline"></a>
            <button onclick="copiar()" class="block w-full mt-4 text-xs text-indigo-400 hover:text-white transition-colors">
                [ Clique para copiar ]
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
