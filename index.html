<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Foco - Manuel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Orbitron', sans-serif; }
        /* Remove setinhas do input */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
    </style>
</head>
<body class="bg-black text-white h-screen flex overflow-hidden">

    <aside class="w-64 bg-slate-900 border-r border-slate-800 p-6 flex flex-col gap-8">
        <div class="text-center">
            <h1 class="text-cyan-500 text-xs tracking-[0.3em] font-bold uppercase">Settings</h1>
        </div>

        <div class="flex flex-col gap-4">
            <div>
                <label class="text-slate-500 text-[10px] uppercase mb-2 block">Minutos p/ Timer</label>
                <input type="number" id="inputMinutos" placeholder="00" 
                       class="w-full bg-black border border-slate-700 rounded-lg p-3 text-white text-center text-xl focus:border-cyan-500 outline-none transition-all">
            </div>

            <button onclick="startTimer()" class="w-full bg-white text-black hover:bg-cyan-400 font-bold py-3 rounded-lg transition-all uppercase text-xs">
                Iniciar
            </button>
            
            <button onclick="pause()" class="w-full border border-slate-700 hover:bg-slate-800 text-slate-300 font-bold py-3 rounded-lg transition-all uppercase text-xs">
                Pausar
            </button>

            <button onclick="reset()" class="w-full text-rose-500 hover:text-rose-400 font-bold py-3 transition-all uppercase text-[10px] mt-4">
                [ Zerar Sistema ]
            </button>
        </div>

        <div class="mt-auto text-[10px] text-slate-600 text-center uppercase tracking-widest">
            v 2.0 | Manuel Dev
        </div>
    </aside>

    <main class="flex-1 flex items-center justify-center relative">
        <div class="absolute w-96 h-96 bg-cyan-500/5 rounded-full blur-[120px]"></div>
        
        <div id="display" class="text-[12rem] font-bold tracking-tighter leading-none z-10">
            00:00:00
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
